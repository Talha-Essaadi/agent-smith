[project]
name = "agent-smith"
version = "0.1.0"
description = "Autonomous reasoning, code generation, and execution agent framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aioconsole>=0.8.2",
    "docker>=7.2.0",
    "flake8>=7.4.1",
    "httpx[cli]>=0.28.1",
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "types-docker>=7.2.0.20261122",
]

[project.scripts]
sandbox = "sandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "sandbox", "schemas", "swebench_tools"]
